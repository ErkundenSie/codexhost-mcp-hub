name: Release MCP Sync Hub

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Pack extension ZIP
        run: node scripts/pack.mjs

      - name: Run automated tests
        run: node --test test/hub.test.mjs

      - name: Build release notes
        shell: bash
        run: |
          VERSION=$(node -p "require('./manifest.json').version")
          TAG="${GITHUB_REF_NAME}"
          if [[ "${GITHUB_REF_TYPE}" != "tag" ]]; then
            TAG="v${VERSION}"
          fi
          export RELEASE_TAG="$TAG"
          export RELEASE_REPO="${GITHUB_REPOSITORY}"
          node --input-type=module <<'EOF'
          import { execFileSync } from "node:child_process";
          import { readFileSync, writeFileSync, existsSync } from "node:fs";

          const tag = process.env.RELEASE_TAG;
          const repo = process.env.RELEASE_REPO || "";
          const escapedTag = tag.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
          let body = "";

          if (existsSync("CHANGELOG.md")) {
            const changelog = readFileSync("CHANGELOG.md", "utf8").replace(/\r\n/g, "\n");
            const re = new RegExp(`^##\\s+\\[?${escapedTag}\\]?[^\\n]*\\n([\\s\\S]*?)(?=^##\\s+|$)`, "m");
            const m = changelog.match(re);
            if (m && m[1].trim()) {
              body = m[1].trim().replace(/\n+---\s*$/, "").trim();
            }
          }

          let prevTag = "";
          try {
            prevTag = execFileSync("git", ["describe", "--tags", "--abbrev=0", `${tag}^`], {
              encoding: "utf8",
              stdio: ["ignore", "pipe", "ignore"],
            }).trim();
          } catch {}

          if (!body) {
            try {
              const range = prevTag ? `${prevTag}..${tag}` : tag;
              const commits = execFileSync("git", ["log", range, "--pretty=format:- %s (%h)"], {
                encoding: "utf8",
              }).trim();
              if (commits) body = `### Changes\n\n${commits}`;
            } catch {}
          }

          if (prevTag && repo) {
            body += `\n\n---\n**Full Changelog**: https://github.com/${repo}/compare/${prevTag}...${tag}`;
          }

          writeFileSync("dist/release-notes.md", (body || `Release ${tag}`).trim() + "\n", "utf8");
          EOF
          cat dist/release-notes.md

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ID=$(node -p "require('./manifest.json').id")
          VERSION=$(node -p "require('./manifest.json').version")
          TAG="${GITHUB_REF_NAME}"
          if [[ "${GITHUB_REF_TYPE}" != "tag" ]]; then
            TAG="v${VERSION}"
          fi
          ZIP="dist/${ID}-${VERSION}.zip"
          if [ ! -f "$ZIP" ]; then
            echo "Expected package not found: $ZIP" >&2
            exit 1
          fi
          ASSETS=("$ZIP" "assets/icon.png" "assets/preview.png")
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${ASSETS[@]}" --clobber
            gh release edit "$TAG" --notes-file dist/release-notes.md
          else
            gh release create "$TAG" "${ASSETS[@]}" \
              --title "${TAG} — MCP Sync Hub" \
              --notes-file dist/release-notes.md
          fi
